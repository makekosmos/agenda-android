name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform + NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Rust toolchain (from rust/rust-toolchain.toml) + Android targets
        working-directory: rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      # SyncE2eTest needs a desktop Engine built from cortex; it is skipped
      # (JUnit assumption) unless scripts/sync-e2e.sh sets SYNC_E2E_DESKTOP_LOCK.
      - name: Core JVM tests (host .so)
        run: ./gradlew :core:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest -PagendaAbis=x86_64

      - name: Roborazzi verify
        run: ./gradlew :app:verifyRoborazziDebug -PagendaAbis=x86_64

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -PagendaAbis=x86_64

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
            core/build/reports/
          if-no-files-found: ignore
