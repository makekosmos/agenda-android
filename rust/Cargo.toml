[workspace]

[package]
name = "agenda-mobile"
version = "0.1.0"
edition = "2021"
description = "Android Agenda FFI library: engine-mobile UniFFI surface plus agenda-core rules, linked into one .so"

[features]
default = []
# Builds the `uniffi-bindgen` bin used to emit Kotlin bindings
# (`cargo run --features cli --bin uniffi-bindgen`).
cli = ["uniffi/cli"]

[lib]
name = "agenda_mobile"
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
# Path deps until the cortex and agenda-gpui PRs merge; then these become
# git deps pinned to SHAs (see docs/decisions.tsv).
engine-mobile = { path = "../../wt/cortex-android/runtime/crates/engine-mobile" }
agenda-core = { path = "../../wt/agenda-gpui-android/crates/agenda-core" }
uniffi = "0.29"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
