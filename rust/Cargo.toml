[workspace]

[package]
name = "agenda-mobile"
version = "0.1.0"
edition = "2021"
description = "Android Agenda FFI library: engine-mobile UniFFI surface plus agenda-core rules, linked into one .so"

[features]
default = []
# Builds the `uniffi-bindgen` bin used to emit Kotlin bindings
# (`cargo run --features cli --bin uniffi-bindgen`).
cli = ["uniffi/cli"]

[lib]
name = "agenda_mobile"
crate-type = ["cdylib", "rlib"]
doctest = false

# p9 size work: the cdylib ships uncompressed in the APK
# (extractNativeLibs=false), so every .so byte lands in both the APK
# and the installed footprint. panic stays "unwind" — uniffi's FFI
# boundary catches panics and turns them into Kotlin exceptions.
# p10: no cargo strip — the build output keeps its symbol table as the
# release symbolication artifact (app/build/rust-jnilibs/<abi>/), and
# AGP strips the copy it packs into the APK (ndkVersion is pinned in
# app/build.gradle.kts).
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "debuginfo"

# Debug/e2e APKs (scripts/build-rust.sh, AGENDA_RUST_PROFILE): optimized
# like release but without fat LTO, so incremental rebuilds stay fast.
[profile.android-dev]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
# Git deps pinned by rev (branch kos-370-android in each repo). To build
# against local checkouts instead, copy rust/.cargo/config.example.toml to
# rust/.cargo/config.toml (gitignored) and point the [patch] paths at them.
engine-mobile = { git = "https://github.com/makekosmos/cortex", rev = "aa74da0c3c04aca62039feeddec3e4ffedf24cde" }
agenda-core = { git = "https://github.com/makekosmos/agenda-gpui", rev = "236dd1d209025bae91dde0c06a43359d52b5663f" }
frizbee = "=0.13.0"
uniffi = "0.29"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
